name: Environment Setup
description: Sets up the environment

inputs: 
  os: 
    required: true
    type: string

runs:
  using: "composite"
  steps:
    # Remove unused packages in the CI runner to free up disk space
    # https://github.com/actions/runner-images/issues/2840
    - name: Free disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc

    - name: Run environment_setup.sh
      shell: bash
      run: |
        sudo "${GITHUB_WORKSPACE}"/scripts/environment_setup.sh

    - name: Install GUI dependencies for Linux runner
      shell: bash
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install xvfb libxcb-cursor0 python3-pyqt6
    
    - name: Install GUI dependencies for macOS
      shell: bash
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install pyqt@6

    - name: Cache Bazel disk cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/thunderbots_bazel_disk_cache
        key: bazel-cache-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          bazel-cache-${{ runner.os }}-${{ github.job }}-
          bazel-cache-${{ runner.os }}-

